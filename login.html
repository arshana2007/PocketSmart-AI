{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-16 bg-white p-8 rounded-2xl shadow border border-slate-200">
  <h2 class="text-2xl font-bold text-center mb-6">Welcome Back</h2>
  {% if error %}<div class="bg-red-50 text-red-700 text-xs p-3 rounded mb-4">{{ error }}</div>{% endif %}
  <form action="/login" method="post" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
      <input type="text" name="username" required class="w-full border rounded-lg p-2.5 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
      <input type="password" name="password" required class="w-full border rounded-lg p-2.5 text-sm">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg shadow">Sign In</button>
  </form>
  <p class="text-center text-xs text-slate-500 mt-4">Don't have an account? <a href="/register" class="text-indigo-600 hover:underline">Register</a></p>
</div>
{% endblock %}
